name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q analyze_polish_funds.py dashboard.py workflows

      - name: Unit tests (mock-based)
        run: python test_with_mocks.py

      - name: Code-quality tests
        run: python test_code_quality.py

      - name: Dashboard smoke tests
        run: python test_dashboard.py

      - name: Module tests (rebalancing, alerts, metrics, workflow, providers)
        run: |
          python test_rebalancing.py
          python test_alerts.py
          python test_metrics_advanced.py
          python test_workflow.py
          python test_providers.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # Fail only on real correctness problems (undefined names, syntax
      # errors, broken f-strings) rather than style nitpicks.
      - name: Lint for critical errors
        run: ruff check --select=E9,F63,F7,F82 --target-version=py310 .
